name: Claude
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-haiku-4-5-20251001 --max-turns 10"

      - name: Merge Claude's branch into main
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin
          BRANCH=$(git branch -r | grep 'origin/claude/' | sed 's|.*origin/||' | head -1 | xargs)
          if [ -n "$BRANCH" ]; then
            echo "Found branch: $BRANCH"
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git checkout main
            git pull origin main
            git merge --squash "origin/$BRANCH" --allow-unrelated-histories
            git commit -m "Apply website changes from dashboard request" || echo "Nothing to commit"
            git push origin main
            git push origin --delete "$BRANCH" || true
          else
            echo "No Claude branch found"
          fi
