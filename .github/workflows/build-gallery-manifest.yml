name: Build Cabin Gallery Manifest

on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build manifest
        run: node scripts/build-gallery-manifest.js

      - name: Commit manifest if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add assets/cabin-gallery.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Rebuild cabin gallery manifest [skip ci]"
          git push origin main
